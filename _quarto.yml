project:
  title: "green-anole-litter"
  type: website
  output-dir: docs
  # supplementary appendices are rendered separately (supplement/render-supplement.sh)
  render:
    - "*.qmd"
    - "!supplement/"

website:
  announcement:
    dismissable: false
    position: above-navbar
    content: "Behavioral innovation enables the poleward range expansion of a tropical ectotherm beyond its physiological limits"
  navbar:
    title: false
    left:
    - text: "Start Here"
      href: index.qmd
    - text: "Living Below CT<sub>min</sub>"
      href: live-beyond-ctmin.qmd
    - text: "Leaf Litter Retreat"
      href: leaf-litter-retreat.qmd
    - text: "Biophysical Models"
      href: biophysical-models.qmd
    - text: "Predicting Poleward Limits"
      href: envelope-models.qmd
    right:
    - icon: github
      href: https://github.com/ggcostoya/green-anole-litter
      aria-label: GitHub

format:
  html:
    theme: cosmo
    css: styles.css
    toc: true
    lightbox: true

knitr:
  opts_chunk:
    dev: png
    dpi: 350
execute:
  warning: false
  message: false
